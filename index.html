<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,XOPQ,XTRA,YOPQ,YTDE,YTFI,YTLC,YTUC@8..144,100..1000,96,468,79,-203,738,514,712&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Web Design</h1>
      </header>
      <nav>
        <a href="#ricky">Ricky</a>
        <a href="#bubbles">Bubbles</a>
        <a href="#julian">Julian</a>
      </nav>
      <main>
        <form>
          <div class="formbox">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" />
          </div>
          <div class="formbox">
            <label for="pass">Password</label>
            <input type="password" id="pass" name="pass" />
          </div>
          <fieldset>
            <legend>Pick a Flavour</legend>
            <div class="formbox">
              <label for="flavChoc">Chocolate</label>
              <input type="radio" id="flavChoc" name="flavour" checked value="choc" />
            </div>
            <div class="formbox">
              <label for="flavVan">Vanilla</label>
              <input type="radio" id="flavVan" name="flavour" value="van" />
            </div>
          </fieldset>
          <div class="formbox">
            <label for="spam">Gimme Spam</label>
            <input type="checkbox" id="spam" name="spam" value="yes" />
          </div>
          <label class="formbox toggle">
            <input type="checkbox" id="choose" name="choose" value="yes" />
          </label>
          <div class="formbox">
            <button class="btn">Submit</button>
          </div>
        </form>
      </main>
      <div id="ricky" class="foot">
        <h2>Ricky</h2>
      </div>
      <div id="bubbles" class="foot">
        <h2>Bubbles</h2>
      </div>
      <div id="julian" class="foot">
        <h2>Julian</h2>
      </div>
    </div>
  </body>
</html>
